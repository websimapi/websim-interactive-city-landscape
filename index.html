<html><head><base href="https://mydomain.com">
<style>
  body {
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #f0f0f0;
  }

  .carpet {
    width: 800px;
    height: 600px;
    background: #8BC34A;
    position: relative;
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(0,0,0,0.2);
    overflow: hidden;
  }

  .road {
    background: #555;
    position: absolute;
  }

  .road-h {
    height: 40px;
    width: 100%;
  }

  .road-v {
    width: 40px;
    height: 100%;
  }

  .road-lines {
    position: absolute;
    background: #fff;
    height: 4px;
    width: 30px;
    top: 50%;
    transform: translateY(-50%);
    animation: moveLines 2s linear infinite;
  }

  @keyframes moveLines {
    from { transform: translateX(-100%) translateY(-50%); }
    to { transform: translateX(800px) translateY(-50%); }
  }

  .building {
    position: absolute;
    background: #fff;
    border: 2px solid #333;
  }

  .tree {
    position: absolute;
    width: 30px;
    height: 40px;
  }

  .car {
    position: absolute;
    width: 30px;
    height: 20px;
    background: red;
    border-radius: 5px;
    animation: driveCar 8s linear infinite;
  }

</style>
</head>
<body>
<div class="carpet">
  <!-- Horizontal Roads -->
  <div class="road road-h" style="top: 150px;">
    <div class="road-lines"></div>
  </div>
  <div class="road road-h" style="top: 400px;">
    <div class="road-lines"></div>
  </div>
  
  <!-- Vertical Roads -->
  <div class="road road-v" style="left: 200px;"></div>
  <div class="road road-v" style="left: 600px;"></div>

  <!-- Buildings -->
  <div class="building" style="width: 80px; height: 100px; top: 20px; left: 80px; background: #FFE082;"></div>
  <div class="building" style="width: 60px; height: 70px; top: 40px; left: 300px; background: #90CAF9;"></div>
  <div class="building" style="width: 90px; height: 120px; top: 250px; left: 400px; background: #EF9A9A;"></div>
  <div class="building" style="width: 70px; height: 90px; top: 450px; left: 100px; background: #B39DDB;"></div>

  <!-- Trees (using SVG) -->
  <svg class="tree" style="top: 50px; left: 500px">
    <circle cx="15" cy="15" r="12" fill="#2E7D32"/>
    <rect x="13" y="25" width="4" height="10" fill="#4E342E"/>
  </svg>

  <svg class="tree" style="top: 200px; left: 100px">
    <circle cx="15" cy="15" r="12" fill="#2E7D32"/>
    <rect x="13" y="25" width="4" height="10" fill="#4E342E"/>
  </svg>

  <svg class="tree" style="top: 500px; left: 300px">
    <circle cx="15" cy="15" r="12" fill="#2E7D32"/>
    <rect x="13" y="25" width="4" height="10" fill="#4E342E"/>
  </svg>

  <!-- Cars -->
  <div class="car" style="top: 160px; background: #F44336;"></div>
  <div class="car" style="top: 410px; background: #2196F3;"></div>

  <!-- Playground -->
  <svg style="position: absolute; top: 250px; left: 700px; width: 60px; height: 60px">
    <circle cx="30" cy="30" r="25" fill="#FDD835" stroke="#000" stroke-width="2"/>
    <rect x="20" y="15" width="20" height="30" fill="#3E2723"/>
  </svg>
</div>

<script>
// Add some interactive elements
document.querySelectorAll('.car').forEach(car => {
  car.addEventListener('click', () => {
    car.style.backgroundColor = '#' + Math.floor(Math.random()*16777215).toString(16);
  });
});

document.querySelectorAll('.building').forEach(building => {
  building.addEventListener('mouseover', () => {
    building.style.transform = 'scale(1.1)';
  });
  building.addEventListener('mouseout', () => {
    building.style.transform = 'scale(1)';
  });
});
</script>

</body></html>
