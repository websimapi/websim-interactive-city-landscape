<html><head><base href="https://mydomain.com">
<style>
  body {
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #f0f0f0;
    flex-direction: column;
    gap: 20px;
    overflow: hidden;
  }

  .carpet {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
    background-size: cover;
    background-position: center;
    border: none;
  }

  .viewport {
    position: absolute;
    width: 100%;
    height: 100%;
    transform-origin: center;
    transition: transform 0.1s ease-out;
  }

  #canvas, #debugCanvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 2000px;  /* Larger canvas for more detailed world */
    height: 1500px;
  }

  #debugCanvas {
    pointer-events: none;
    opacity: 0.5;
  }

  .car {
    position: absolute;
    width: 60px;  /* Bigger car */
    height: 60px;
    transform-origin: center;
    transition: transform 0.1s;
    z-index: 1000;
  }

  .coin {
    position: absolute;
    width: 30px;  /* Bigger coins */
    height: 30px;
    background: gold;
    border-radius: 50%;
    animation: coinSpin 1s infinite linear;
  }

  @keyframes coinSpin {
    0% { transform: scale(1); }
    50% { transform: scale(0.8); }
    100% { transform: scale(1); }
  }

  #score {
    position: fixed;
    top: 20px;
    right: 20px;
    font-size: 24px;
    font-family: Arial, sans-serif;
    background: white;
    padding: 10px;
    border-radius: 5px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    z-index: 2000;
  }

  .debug-controls {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 2000;
    background: white;
    padding: 10px;
    border-radius: 5px;
    display: flex;
    gap: 10px;
    align-items: center;
  }
</style>
</head>
<body>
<div class="debug-controls">
  <label>
    <input type="checkbox" id="showDebug"> Show Road Detection Debug View
  </label>
  <button id="redetectRoads">Redetect Roads</button>
  <button id="newMap">New Map</button>
</div>
<div id="score">Score: 0</div>
<div class="carpet">
  <div class="viewport">
    <canvas id="canvas" width="2000" height="1500"></canvas>
    <canvas id="debugCanvas" width="2000" height="1500"></canvas>
    <svg id="car" class="car" viewBox="0 0 100 100">
      <path d="M20,65 Q50,75 80,65 L90,45 Q50,35 10,45 L20,65" 
            fill="#FF4444" stroke="#000" stroke-width="2"/>
      <path d="M15,45 Q50,35 85,45 L80,30 Q50,20 20,30 L15,45" 
            fill="#FF6666" stroke="#000" stroke-width="2"/>
      <circle cx="30" cy="65" r="8" fill="#333"/>
      <circle cx="70" cy="65" r="8" fill="#333"/>
      <rect x="35" y="35" width="30" height="15" fill="#88CCFF" rx="2"/>
      <line x1="50" y1="35" x2="50" y2="50" stroke="#333" stroke-width="2"/>
    </svg>
  </div>
</div>

<script>
const carpet = document.querySelector('.carpet');
const viewport = document.querySelector('.viewport');
const canvas = document.getElementById('canvas');
const debugCanvas = document.getElementById('debugCanvas');
const ctx = canvas.getContext('2d');
const debugCtx = debugCanvas.getContext('2d');
const car = document.getElementById('car');
const showDebugCheckbox = document.getElementById('showDebug');
const redetectButton = document.getElementById('redetectRoads');
const newMapButton = document.getElementById('newMap');

let roadPoints = [];
let coins = [];
let score = 0;
let carX = canvas.width / 2;
let carY = canvas.height / 2;
let targetX = carX;
let targetY = carY;
let scoreElement = document.getElementById('score');
const ZOOM_LEVEL = 2;  // Zoom factor

showDebugCheckbox.addEventListener('change', () => {
  debugCanvas.style.display = showDebugCheckbox.checked ? 'block' : 'none';
});

debugCanvas.style.display = 'none';

function loadNewMap() {
  const timestamp = new Date().getTime(); 
  const img = new Image();
  img.crossOrigin = "Anonymous";
  img.src = `https://image.pollinations.ai/prompt/A%20colorful%20children%27s%20play%20carpet%20with%20roads,%20buildings,%20and%20trees,%20birds-eye%20view,%20vintage%20style,%20warm%20colors,%20educational%20toy,%20white%20road%20lines,%20dashed%20center%20lines?${timestamp}`;
  
  img.onload = function() {
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    detectRoads();
  };
  
  viewport.style.backgroundImage = `url(${img.src})`;
  viewport.style.backgroundSize = `${canvas.width}px ${canvas.height}px`;
}

function updateViewport() {
  const screenCenterX = window.innerWidth / 2;
  const screenCenterY = window.innerHeight / 2;
  const translateX = screenCenterX - carX * ZOOM_LEVEL;
  const translateY = screenCenterY - carY * ZOOM_LEVEL;
  
  viewport.style.transform = `translate(${translateX}px, ${translateY}px) scale(${ZOOM_LEVEL})`;
}

newMapButton.addEventListener('click', loadNewMap);

loadNewMap();

function isWhitePixel(r, g, b) {
  const threshold = 200;
  return r > threshold && g > threshold && b > threshold;
}

function detectRoads() {
  roadPoints = [];
  debugCtx.clearRect(0, 0, debugCanvas.width, debugCanvas.height);
  
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const data = imageData.data;
  
  debugCtx.fillStyle = 'rgba(255, 0, 0, 0.3)';
  
  for(let y = 0; y < canvas.height; y += 3) {
    for(let x = 0; x < canvas.width; x += 3) {
      const index = (y * canvas.width + x) * 4;
      const r = data[index];
      const g = data[index + 1];
      const b = data[index + 2];
      
      if(isWhitePixel(r, g, b)) {
        let roadFound = false;
        for(let radius = 10; radius < 40; radius += 5) {
          let whitePixelsFound = 0;
          
          for(let angle = 0; angle < 360; angle += 45) {
            const radians = angle * Math.PI / 180;
            const checkX = x + Math.cos(radians) * radius;
            const checkY = y + Math.sin(radians) * radius;
            
            if(checkX >= 0 && checkX < canvas.width && checkY >= 0 && checkY < canvas.height) {
              const checkIndex = (Math.floor(checkY) * canvas.width + Math.floor(checkX)) * 4;
              if(isWhitePixel(data[checkIndex], data[checkIndex + 1], data[checkIndex + 2])) {
                whitePixelsFound++;
              }
            }
          }
          
          if(whitePixelsFound >= 2) {
            roadFound = true;
            break;
          }
        }
        
        if(roadFound) {
          roadPoints.push({x, y});
          debugCtx.fillRect(x - 1, y - 1, 3, 3);
        }
      }
    }
  }
  
  coins.forEach(coin => coin.remove());
  coins = [];
  
  for(let i = 0; i < 20; i++) {  // More coins
    if(roadPoints.length > 0) {
      const randomIndex = Math.floor(Math.random() * roadPoints.length);
      const point = roadPoints[randomIndex];
      createCoin(point.x, point.y);
    }
  }
}

redetectButton.addEventListener('click', detectRoads);

function createCoin(x, y) {
  const coin = document.createElement('div');
  coin.className = 'coin';
  coin.style.left = x + 'px';
  coin.style.top = y + 'px';
  viewport.appendChild(coin);
  coins.push(coin);
}

carpet.addEventListener('mousemove', (e) => {
  const rect = carpet.getBoundingClientRect();
  const screenX = e.clientX - rect.left;
  const screenY = e.clientY - rect.top;
  
  // Convert screen coordinates to world coordinates
  const viewportTransform = new DOMMatrix(getComputedStyle(viewport).transform);
  const inverse = viewportTransform.inverse();
  const point = new DOMPoint(screenX, screenY).matrixTransform(inverse);
  
  targetX = point.x;
  targetY = point.y;
});

function checkCollision(carX, carY, coinElement) {
  const coinRect = coinElement.getBoundingClientRect();
  const carpetRect = carpet.getBoundingClientRect();
  const viewportTransform = new DOMMatrix(getComputedStyle(viewport).transform);
  const inverse = viewportTransform.inverse();
  
  const coinPoint = new DOMPoint(coinRect.left - carpetRect.left, coinRect.top - carpetRect.top)
    .matrixTransform(inverse);
  
  const distance = Math.sqrt(
    Math.pow(carX - coinPoint.x, 2) + 
    Math.pow(carY - coinPoint.y, 2)
  );
  
  return distance < 60;  // Larger collision radius
}

function updateCar() {
  const dx = targetX - carX;
  const dy = targetY - carY;
  const angle = Math.atan2(dy, dx) * 180 / Math.PI;
  const distance = Math.sqrt(dx * dx + dy * dy);
  
  const speed = Math.min(distance * 0.1, 5);
  
  if(distance > 1) {
    carX += Math.cos(angle * Math.PI / 180) * speed;
    carY += Math.sin(angle * Math.PI / 180) * speed;
  }
  
  carX = Math.max(30, Math.min(carX, canvas.width - 30));
  carY = Math.max(30, Math.min(carY, canvas.height - 30));
  
  car.style.transform = `translate(${carX}px, ${carY}px) rotate(${angle + 90}deg)`;
  
  updateViewport();
  
  coins.forEach((coin, index) => {
    if(checkCollision(carX, carY, coin)) {
      coin.remove();
      coins.splice(index, 1);
      score += 10;
      scoreElement.textContent = `Score: ${score}`;
      
      if(roadPoints.length > 0) {
        const randomIndex = Math.floor(Math.random() * roadPoints.length);
        const point = roadPoints[randomIndex];
        createCoin(point.x, point.y);
      }
    }
  });
}

function gameLoop() {
  updateCar();
  requestAnimationFrame(gameLoop);
}

car.style.left = carX + 'px';
car.style.top = carY + 'px';
gameLoop();
</script>
