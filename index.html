<html><head><base href="https://mydomain.com">
<style>
  body {
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #f0f0f0;
  }

  .carpet {
    width: 800px;
    height: 600px;
    position: relative;
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(0,0,0,0.2);
    overflow: hidden;
    background-image: url('https://image.pollinations.ai/prompt/A%20colorful%20children%27s%20play%20carpet%20with%20roads,%20buildings,%20and%20trees,%20birds-eye%20view,%20vintage%20style,%20warm%20colors,%20educational%20toy');
    background-size: cover;
    background-position: center;
    border: 15px solid #8B4513;
  }

  #canvas {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
  }

  .carpet-border {
    position: absolute;
    top: -15px;
    left: -15px;
    right: -15px;
    bottom: -15px;
    border: 15px solid #8B4513;
    border-radius: 20px;
    pointer-events: none;
  }

</style>
</head>
<body>
<div class="carpet">
  <canvas id="canvas" width="800" height="600"></canvas>
  <div class="carpet-border"></div>
</div>

<script>
// Create an image processing system to detect roads
const carpet = document.querySelector('.carpet');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// Create a new image object
const img = new Image();
img.crossOrigin = "Anonymous";  // Enable CORS
img.src = 'https://image.pollinations.ai/prompt/A%20colorful%20children%27s%20play%20carpet%20with%20roads,%20buildings,%20and%20trees,%20birds-eye%20view,%20vintage%20style,%20warm%20colors,%20educational%20toy';

img.onload = function() {
  // Draw the image on the canvas
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  
  // Get image data
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const data = imageData.data;
  
  // Process the image to detect roads (looking for dark pixels that could be roads)
  ctx.strokeStyle = 'rgba(255, 255, 0, 0.3)';
  ctx.lineWidth = 2;
  
  // Analyze every 10th pixel for performance
  for(let y = 0; y < canvas.height; y += 10) {
    for(let x = 0; x < canvas.width; x += 10) {
      const index = (y * canvas.width + x) * 4;
      const r = data[index];
      const g = data[index + 1];
      const b = data[index + 2];
      
      // Calculate brightness
      const brightness = (r + g + b) / 3;
      
      // If pixel is dark enough (potential road)
      if(brightness < 100) {
        ctx.beginPath();
        ctx.arc(x, y, 2, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
  }
};

// Add click handler to show coordinates and color values
canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  
  const imageData = ctx.getImageData(x, y, 1, 1);
  const data = imageData.data;
  
  console.log(`Position: (${x}, ${y})`);
  console.log(`Color: RGB(${data[0]}, ${data[1]}, ${data[2]})`);
});
</script>
