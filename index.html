<html><head><base href="https://mydomain.com">
<style>
  body {
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #f0f0f0;
    flex-direction: column;
    gap: 20px;
  }

  .carpet {
    width: 800px;
    height: 600px;
    position: relative;
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(0,0,0,0.2);
    overflow: hidden;
    background-image: url('https://image.pollinations.ai/prompt/A%20colorful%20children%27s%20play%20carpet%20with%20roads,%20buildings,%20and%20trees,%20birds-eye%20view,%20vintage%20style,%20warm%20colors,%20educational%20toy,%20white%20road%20lines,%20dashed%20center%20lines');
    background-size: cover;
    background-position: center;
    border: 15px solid #8B4513;
  }

  #canvas, #debugCanvas {
    position: absolute;
    top: 0;
    left: 0;
  }

  #debugCanvas {
    pointer-events: none;
    opacity: 0.5;
  }

  .car {
    position: absolute;
    width: 30px;
    height: 20px;
    background: red;
    border-radius: 5px;
    transform-origin: center;
    transition: transform 0.1s;
  }

  .coin {
    position: absolute;
    width: 15px;
    height: 15px;
    background: gold;
    border-radius: 50%;
    animation: coinSpin 1s infinite linear;
  }

  @keyframes coinSpin {
    0% { transform: scale(1); }
    50% { transform: scale(0.8); }
    100% { transform: scale(1); }
  }

  .carpet-border {
    position: absolute;
    top: -15px;
    left: -15px;
    right: -15px;
    bottom: -15px;
    border: 15px solid #8B4513;
    border-radius: 20px;
    pointer-events: none;
  }

  #score {
    position: fixed;
    top: 20px;
    right: 20px;
    font-size: 24px;
    font-family: Arial, sans-serif;
    background: white;
    padding: 10px;
    border-radius: 5px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
  }

  .debug-controls {
    display: flex;
    gap: 10px;
    align-items: center;
  }
</style>
</head>
<body>
<div class="debug-controls">
  <label>
    <input type="checkbox" id="showDebug"> Show Road Detection Debug View
  </label>
  <button id="redetectRoads">Redetect Roads</button>
</div>
<div id="score">Score: 0</div>
<div class="carpet">
  <canvas id="canvas" width="800" height="600"></canvas>
  <canvas id="debugCanvas" width="800" height="600"></canvas>
  <div id="car" class="car"></div>
  <div class="carpet-border"></div>
</div>

<script>
const carpet = document.querySelector('.carpet');
const canvas = document.getElementById('canvas');
const debugCanvas = document.getElementById('debugCanvas');
const ctx = canvas.getContext('2d');
const debugCtx = debugCanvas.getContext('2d');
const car = document.getElementById('car');
const showDebugCheckbox = document.getElementById('showDebug');
const redetectButton = document.getElementById('redetectRoads');

let roadPoints = [];
let coins = [];
let score = 0;
let carX = 400;
let carY = 300;
let carAngle = 0;
let speed = 0;
let scoreElement = document.getElementById('score');

showDebugCheckbox.addEventListener('change', () => {
  debugCanvas.style.display = showDebugCheckbox.checked ? 'block' : 'none';
});

debugCanvas.style.display = 'none';

const img = new Image();
img.crossOrigin = "Anonymous";
img.src = 'https://image.pollinations.ai/prompt/A%20colorful%20children%27s%20play%20carpet%20with%20roads,%20buildings,%20and%20trees,%20birds-eye%20view,%20vintage%20style,%20warm%20colors,%20educational%20toy,%20white%20road%20lines,%20dashed%20center%20lines';

function isWhitePixel(r, g, b) {
  const threshold = 200;
  return r > threshold && g > threshold && b > threshold;
}

function detectRoads() {
  roadPoints = [];
  debugCtx.clearRect(0, 0, debugCanvas.width, debugCanvas.height);
  
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const data = imageData.data;
  
  debugCtx.fillStyle = 'rgba(255, 0, 0, 0.3)';
  
  for(let y = 0; y < canvas.height; y += 3) {
    for(let x = 0; x < canvas.width; x += 3) {
      const index = (y * canvas.width + x) * 4;
      const r = data[index];
      const g = data[index + 1];
      const b = data[index + 2];
      
      if(isWhitePixel(r, g, b)) {
        // Look for parallel white lines within a radius
        let roadFound = false;
        for(let radius = 10; radius < 40; radius += 5) {
          let whitePixelsFound = 0;
          
          // Check in a circle around the current point
          for(let angle = 0; angle < 360; angle += 45) {
            const radians = angle * Math.PI / 180;
            const checkX = x + Math.cos(radians) * radius;
            const checkY = y + Math.sin(radians) * radius;
            
            if(checkX >= 0 && checkX < canvas.width && checkY >= 0 && checkY < canvas.height) {
              const checkIndex = (Math.floor(checkY) * canvas.width + Math.floor(checkX)) * 4;
              if(isWhitePixel(data[checkIndex], data[checkIndex + 1], data[checkIndex + 2])) {
                whitePixelsFound++;
              }
            }
          }
          
          if(whitePixelsFound >= 2) {
            roadFound = true;
            break;
          }
        }
        
        if(roadFound) {
          roadPoints.push({x, y});
          debugCtx.fillRect(x - 1, y - 1, 3, 3);
        }
      }
    }
  }
  
  // Remove all existing coins
  coins.forEach(coin => coin.remove());
  coins = [];
  
  // Place new coins on detected road points
  for(let i = 0; i < 10; i++) {
    if(roadPoints.length > 0) {
      const randomIndex = Math.floor(Math.random() * roadPoints.length);
      const point = roadPoints[randomIndex];
      createCoin(point.x, point.y);
    }
  }
}

img.onload = function() {
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  detectRoads();
};

redetectButton.addEventListener('click', () => {
  detectRoads();
});

function createCoin(x, y) {
  const coin = document.createElement('div');
  coin.className = 'coin';
  coin.style.left = x + 'px';
  coin.style.top = y + 'px';
  carpet.appendChild(coin);
  coins.push(coin);
}

function checkCollision(carX, carY, coinElement) {
  const coinRect = coinElement.getBoundingClientRect();
  const carpetRect = carpet.getBoundingClientRect();
  const coinX = coinRect.left - carpetRect.left;
  const coinY = coinRect.top - carpetRect.top;
  
  const distance = Math.sqrt(
    Math.pow(carX - coinX, 2) + 
    Math.pow(carY - coinY, 2)
  );
  
  return distance < 30;
}

function updateCar() {
  car.style.transform = `translate(${carX}px, ${carY}px) rotate(${carAngle}deg)`;
  
  coins.forEach((coin, index) => {
    if(checkCollision(carX, carY, coin)) {
      coin.remove();
      coins.splice(index, 1);
      score += 10;
      scoreElement.textContent = `Score: ${score}`;
      
      if(roadPoints.length > 0) {
        const randomIndex = Math.floor(Math.random() * roadPoints.length);
        const point = roadPoints[randomIndex];
        createCoin(point.x, point.y);
      }
    }
  });
}

const keys = {};
document.addEventListener('keydown', (e) => keys[e.key] = true);
document.addEventListener('keyup', (e) => keys[e.key] = false);

function gameLoop() {
  if(keys['ArrowUp']) speed = Math.min(speed + 0.2, 5);
  if(keys['ArrowDown']) speed = Math.max(speed - 0.2, -2);
  if(!keys['ArrowUp'] && !keys['ArrowDown']) speed *= 0.95;
  
  if(keys['ArrowLeft']) carAngle -= 3;
  if(keys['ArrowRight']) carAngle += 3;
  
  carX += Math.sin(carAngle * Math.PI / 180) * speed;
  carY -= Math.cos(carAngle * Math.PI / 180) * speed;
  
  carX = Math.max(0, Math.min(carX, carpet.clientWidth - car.clientWidth));
  carY = Math.max(0, Math.min(carY, carpet.clientHeight - car.clientHeight));
  
  updateCar();
  requestAnimationFrame(gameLoop);
}

car.style.left = carX + 'px';
car.style.top = carY + 'px';
gameLoop();
</script>

</body></html>
